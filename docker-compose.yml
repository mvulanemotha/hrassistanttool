version: "3.9"

networks:
  hr_ai_assistant:
    driver: bridge

services:
  backend:
    build: .
    container_name: hr_ai_assistant_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./cv_documents:/app/cv_documents
      - ./cv_vectorstore:/app/cv_vectorstore
      - ./uploaded_user_cv:/app/uploaded_user_cv
      - ./processed_cv:/app/processed_cv
    depends_on:
      - dbb
    networks:
      - hr_ai_assistant

  dbb:
    image: ankane/pgvector:pg15
    container_name: hrassistant-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - hr_ai_assistant
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
